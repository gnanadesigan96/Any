# Paste into https://api.slack.com/apps -> your app -> App Manifest (or Create New App -> From a manifest).
# Least privilege: the bot can only read/post in channels it is invited to. It cannot list channels,
# look people up by e-mail, or read/send direct messages.
display_information:
  name: Ops Agent
  description: Monthly support allowance workflow
features:
  bot_user:
    display_name: ops-agent
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - reactions:write
      - users:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
