# Paste into https://api.slack.com/apps -> Create New App -> From a manifest
display_information:
  name: Ops Agent
  description: Multipurpose assistant - monthly support allowance workflow and more
features:
  bot_user:
    display_name: ops-agent
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - reactions:write
      - users:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
