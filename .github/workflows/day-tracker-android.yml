# Builds the Day Tracker Android app (APK) on every push that touches day-tracker/,
# and publishes it as a GitHub Release you can download straight to your phone.
name: Day Tracker – Android APK

on:
  push:
    paths:
      - 'day-tracker/**'
      - '.github/workflows/day-tracker-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: day-tracker-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: day-tracker
    env:
      # Optional repository secret (Settings → Secrets and variables → Actions):
      EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: day-tracker/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: day-tracker/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DayTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DayTracker-apk
          path: day-tracker/DayTracker.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: day-tracker-build-${{ github.run_number }}
          name: Day Tracker (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: day-tracker/DayTracker.apk
          body: |
            **Install on your Android phone:** open this page on the phone, tap **DayTracker.apk**,
            then open the downloaded file. If asked, allow "Install unknown apps" for your browser.
            Built from ${{ github.sha }}.
