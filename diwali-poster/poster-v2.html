<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e;};
let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);

// stars
const st=document.getElementById('stars');
for(let i=0;i<90;i++)el('circle',{cx:rnd()*1080,cy:rnd()*520,r:rnd()*1.4+.3,fill:'#fff',opacity:rnd()*.7+.2},st);

// fireworks
const fw=document.getElementById('fireworks');
function firework(cx,cy,R,c1,c2,n){
  const g=el('g',{},fw);
  el('circle',{cx,cy,r:R*1.1,fill:c1,opacity:.18,filter:'url(#blur6)'},g);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rnd()*.05,r=R*(.75+rnd()*.25);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r+r*.06;
    el('path',{d:`M${cx+Math.cos(a)*R*.12},${cy+Math.sin(a)*R*.12} Q${cx+Math.cos(a)*r*.6},${cy+Math.sin(a)*r*.6+4} ${x},${y}`,stroke:i%3?c1:c2,'stroke-width':1.6,fill:'none',opacity:.85,'stroke-linecap':'round'},g);
    el('circle',{cx:x,cy:y,r:2.4,fill:'#fff'},g);el('circle',{cx:x,cy:y,r:4.5,fill:i%3?c1:c2,opacity:.6},g);}
  el('circle',{cx,cy,r:R*.12,fill:'#fff',opacity:.9,filter:'url(#blur2)'},g);
}
firework(250,250,72,'#ff5fcf','#ffd36a',48);
firework(380,345,40,'#ffb347','#ffe9a0',36);
firework(835,250,92,'#c86bff','#ff7ad9',52);
firework(880,415,72,'#ff6a9a','#ffb347',44);
firework(170,420,40,'#ffd36a','#fff',28);

// building
const b=document.getElementById('building');
el('rect',{x:60,y:330,width:225,height:450,fill:'url(#bld)'},b);
el('rect',{x:285,y:400,width:40,height:380,fill:'#9c7e60'},b);
el('path',{d:'M48,330 L298,330 L298,316 L60,316Z',fill:'#f4e6cc'},b);
for(let r=0;r<8;r++){const y=345+r*54;
  el('rect',{x:55,y:y+40,width:240,height:8,fill:'#f7ead2'},b);
  for(let c=0;c<4;c++){const x=72+c*54;
    el('rect',{x,y,width:38,height:36,fill:rnd()>.15?'#ffcf6a':'#6a4a3a'},b);
    el('rect',{x:x+17,y,width:3,height:36,fill:'#a87a3a'},b);}
  el('line',{x1:105,y1:y+30,x2:375,y2:y+30,stroke:'#3a2a20','stroke-width':1.5,opacity:.5},b);
  // fairy light string along balcony
  for(let k=0;k<24;k++)el('circle',{cx:58+k*10,cy:y+44,r:1.6,fill:'#fff3b0'},b);}
for(let r=0;r<6;r++)el('rect',{x:295,y:420+r*60,width:20,height:30,fill:'#ffcf6a',opacity:.8},b);
el('rect',{x:55,y:316,width:270,height:470,fill:'#1d0f3c',opacity:.38},b);

// pool shine & floor
const ps=document.getElementById('poolshine');
for(let i=0;i<40;i++){const x=440+rnd()*620,y=792+rnd()*34;el('line',{x1:x,y1:y,x2:x+10+rnd()*25,y2:y},ps);}
const fl=document.getElementById('floorlines');
for(let i=0;i<9;i++)el('line',{x1:0,y1:845+i*i*4.2,x2:1080,y2:845+i*i*4.2},fl);
for(let i=-6;i<16;i++)el('line',{x1:540+i*30,y1:840,x2:540+i*140,y2:1150},fl);
// reflections of lights on floor
for(let i=0;i<14;i++)el('ellipse',{cx:500+rnd()*560,cy:870+rnd()*240,rx:4,ry:22,fill:'#ffc860',opacity:.25,filter:'url(#blur2)'},fl.parentNode);

// diyas on pool edge, receding
const dr=document.getElementById('diyarow');
[[1045,838,.62],[975,836,.56],[905,834,.5],[840,832,.45],[780,830,.4],[1015,880,.75],[930,875,.68],[860,868,.6],[720,825,.36]].forEach(([x,y,s])=>{
  el('use',{href:'#diya',transform:`translate(${x} ${y}) scale(${s})`},dr);
  el('ellipse',{cx:x,cy:y+16*s+8,rx:6*s,ry:26*s,fill:'#ffc860',opacity:.35,filter:'url(#blur2)'},dr);});

// rangoli
const rg=document.getElementById('rangoli');
const ring=(r,n,col,len,w)=>{for(let i=0;i<n;i++){const a=i/n*360;el('path',{d:`M0,${-r} C${w},${-r-len*.4} ${w*.6},${-r-len} 0,${-r-len} C${-w*.6},${-r-len} ${-w},${-r-len*.4} 0,${-r}Z`,fill:col,transform:`rotate(${a})`},rg);}};
el('circle',{r:205,fill:'#ffd34a'},rg);el('circle',{r:195,fill:'#c2185b'},rg);
ring(150,20,'#ff9800',50,22);ring(110,16,'#ffeb3b',44,20);el('circle',{r:112,fill:'#6a1b9a'},rg);
ring(70,12,'#e91e63',40,18);el('circle',{r:72,fill:'#ff5722'},rg);ring(30,8,'#fff59d',36,14);el('circle',{r:32,fill:'#fff'},rg);el('circle',{r:20,fill:'#e91e63'},rg);
for(let i=0;i<40;i++){const a=i/40*Math.PI*2;el('circle',{cx:Math.cos(a)*200,cy:Math.sin(a)*200,r:5,fill:'#fff'},rg);}
el('use',{href:'#diya',transform:'translate(0 0) scale(1.3 3.6)'},rg);

// marigolds in bowl
const bf=document.getElementById('bowlflowers');
for(let i=0;i<18;i++){const x=-70+(i%6)*28+(Math.floor(i/6)%2)*12,y=-30-Math.floor(i/6)*16+rnd()*6;
  el('circle',{cx:x,cy:y,r:16,fill:i%3?'#ffb300':'#ff8f00',stroke:'#d06a00','stroke-width':2},bf);
  el('circle',{cx:x,cy:y,r:9,fill:'#ffcf40',stroke:'#e08a00','stroke-width':1.5},bf);}

// foreground flowers
const ff=document.getElementById('fgflowers');
for(let i=0;i<9;i++){const x=10+rnd()*260,y=1080+rnd()*70,r=26+rnd()*20,c=rnd()>.3?'#ff9a00':'#ffc21a';
  el('circle',{cx:x,cy:y,r,fill:c},ff);el('circle',{cx:x,cy:y,r:r*.55,fill:c=='#ff9a00'?'#ffb84a':'#ffe27a'},ff);}
for(let i=0;i<5;i++)el('ellipse',{cx:150+i*55,cy:1110+rnd()*30,rx:50,ry:14,fill:'#1f4a22',transform:`rotate(${-30+rnd()*60} ${150+i*55} 1110)`},ff);

// top foliage + fairy lights
const fo=document.getElementById('foliage');
[[260,0,1],[340,10,.8],[420,-5,.7],[700,0,.8],[780,10,1],[640,-8,.6]].forEach(([x,y,s])=>{
  for(let i=0;i<9;i++){const a=rnd()*Math.PI,lx=x+Math.cos(a)*70*s,ly=y+Math.sin(a)*40*s+10;
    el('ellipse',{cx:lx,cy:ly,rx:16*s,ry:8*s,fill:i%2?'#c9a23a':'#7a8a2a',transform:`rotate(${rnd()*180} ${lx} ${ly})`},fo);}
  for(let i=0;i<10;i++){el('circle',{cx:x-60*s+rnd()*120*s,cy:y+rnd()*60*s,r:2.5,fill:'#fff6c0'},fo);}});
for(let x=0;x<1080;x+=12){const y=6+Math.abs(Math.sin(x/90))*24;el('circle',{cx:x,cy:y,r:2.2,fill:'#ffe8a0'},fo);el('circle',{cx:x,cy:y,r:6,fill:'#ffcf6a',opacity:.25},fo);}

// temple gopuram line art
const tp=document.getElementById('temple');
function gopuram(dx,sc){const g=el('g',{transform:`translate(${dx} 0) scale(${sc})`},tp);
  let w=30,y=0;for(let i=0;i<6;i++){const nw=w-4;el('path',{d:`M${-w},${y} L${-nw},${y-8} L${nw},${y-8} L${w},${y}Z`},g);
    for(let k=-nw+5;k<nw;k+=7)el('line',{x1:k,y1:y-1,x2:k,y2:y-7},g);w=nw;y-=8;}
  el('path',{d:`M${-w},${y} Q${-w},${y-10} 0,${y-10} Q${w},${y-10} ${w},${y}`},g);
  [-6,0,6].forEach(k=>el('line',{x1:k,y1:y-10,x2:k,y2:y-15},g));
  el('path',{d:'M-7,0 L-7,-10 Q0,-16 7,-10 L7,0',fill:'#1a0c2a'},g);}
gopuram(-110,.55);gopuram(110,.55);gopuram(-60,.75);gopuram(60,.75);gopuram(0,1);
el('line',{x1:-150,y1:0,x2:150,y2:0},tp);

// mandala arch
const ar=document.getElementById('arch');
el('path',{d:'M-210,140 L-210,0 A210,210 0 0 1 210,0 L210,140',fill:'#1a0a30','fill-opacity':.45,stroke:'none'},ar);
for(let i=0;i<=18;i++){const a=Math.PI+i/18*Math.PI,x=Math.cos(a)*215,y=Math.sin(a)*215;
  el('path',{d:'M0,0 C8,-10 8,-22 0,-34 C-8,-22 -8,-10 0,0Z',fill:'none',stroke:'#f2bd45','stroke-width':1.6,transform:`translate(${x} ${y}) rotate(${i/18*180-90})`},ar);
  el('circle',{cx:Math.cos(a)*258,cy:Math.sin(a)*258,r:2.5,fill:'#ffd36a'},ar);}
el('path',{d:'M-210,0 A210,210 0 0 1 210,0',fill:'none',stroke:'#f2bd45','stroke-width':2},ar);
el('path',{d:'M-196,0 A196,196 0 0 1 196,0',fill:'none',stroke:'#f2bd45','stroke-width':1,'stroke-dasharray':'3 5'},ar);
for(let i=0;i<=12;i++){const a=Math.PI+i/12*Math.PI;
  el('path',{d:'M0,0 C14,-14 14,-30 0,-44 C-14,-30 -14,-14 0,0Z',fill:'#f2bd45','fill-opacity':.12,stroke:'#f2bd45','stroke-width':1.2,transform:`translate(${Math.cos(a)*165} ${Math.sin(a)*165}) rotate(${i/12*180-90})`},ar);}
</script>
</body>
</html>
