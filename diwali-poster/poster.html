<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Happy Diwali – Aura Grand Stay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=block" rel="stylesheet">
<style>
  :root{--gold:#f6c64f;--gold2:#ffe9a8;--gold3:#b9801f;--maroon:#4a0716;--deep:#1c0210;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;}
  .poster{position:relative;width:1080px;height:1350px;overflow:hidden;
    background:
      radial-gradient(ellipse 60% 45% at 50% 47%, rgba(255,170,60,.35), transparent 70%),
      radial-gradient(ellipse at 50% 40%, #7a0f2b 0%, #4a0716 45%, #1c0210 100%);
    font-family:'Cormorant Garamond',serif;color:var(--gold2);}
  svg.layer{position:absolute;inset:0;width:100%;height:100%;}
  .gold-text{background:linear-gradient(180deg,#fff6d0 0%,#ffd86b 35%,#e9a92c 60%,#fff0b5 80%,#c88a22 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .brand-top{margin-top:112px;font-family:'Cinzel',serif;font-weight:700;letter-spacing:10px;font-size:38px;color:var(--gold);}
  .brand-top small{display:block;font-size:17px;letter-spacing:7px;margin-top:10px;color:#f3d79a;font-weight:500}
  .wish{margin-top:235px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:44px;color:#ffe3a3;letter-spacing:2px;}
  .happy{font-family:'Great Vibes',cursive;font-size:150px;line-height:1;margin-top:6px;
    filter:drop-shadow(0 0 18px rgba(255,190,70,.55)) drop-shadow(0 4px 2px rgba(0,0,0,.6));}
  .diwali{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:142px;letter-spacing:12px;line-height:1;margin-top:-6px;
    filter:drop-shadow(0 0 22px rgba(255,180,60,.6)) drop-shadow(0 5px 3px rgba(0,0,0,.7));}
  .divider{margin:26px 0 18px;}
  .msg{font-size:32px;line-height:1.45;color:#fbe6b8;max-width:780px;font-weight:500}
  .msg em{color:var(--gold);font-weight:600}
  .from{position:absolute;bottom:100px;left:0;right:0;}
  .from .lbl{font-style:italic;font-size:28px;color:#f5d995;}
  .from .name{font-family:'Great Vibes',cursive;font-size:84px;line-height:1.05;
    filter:drop-shadow(0 0 12px rgba(255,190,70,.45));}
</style>
</head>
<body>
<div class="poster">
  <!-- Background ornaments -->
  <svg class="layer" viewBox="0 0 1080 1350">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff2b8"/><stop offset=".45" stop-color="#f2bd45"/><stop offset="1" stop-color="#a86d16"/>
      </linearGradient>
      <radialGradient id="flame" cx=".5" cy=".7" r=".6">
        <stop offset="0" stop-color="#fffbe0"/><stop offset=".35" stop-color="#ffd54a"/><stop offset=".75" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffcf6a" stop-opacity=".75"/><stop offset="1" stop-color="#ff9a2a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff1b0"/><stop offset=".5" stop-color="#ff9d2e"/><stop offset="1" stop-color="#c2410c"/>
      </radialGradient>
      <!-- mandala petal -->
      <g id="petal"><path d="M0,-120 C22,-90 22,-55 0,-30 C-22,-55 -22,-90 0,-120Z" fill="none" stroke="url(#g)" stroke-width="2"/>
        <circle cx="0" cy="-132" r="4" fill="url(#g)"/></g>
      <g id="petal2"><path d="M0,-210 C40,-170 36,-120 0,-90 C-36,-120 -40,-170 0,-210Z" fill="none" stroke="url(#g)" stroke-width="1.5" opacity=".8"/>
        <path d="M0,-195 C22,-165 20,-128 0,-108 C-20,-128 -22,-165 0,-195Z" fill="url(#g)" opacity=".18"/></g>
      <!-- diya -->
      <g id="diya">
        <ellipse cx="0" cy="-40" rx="60" ry="70" fill="url(#glow)"/>
        <path d="M-9,-18 C-10,-38 0,-52 0,-62 C0,-52 10,-38 9,-18 C6,-8 -6,-8 -9,-18Z" fill="url(#flame)"/>
        <path d="M-4,-16 C-4,-26 0,-32 0,-38 C0,-32 4,-26 4,-16 C3,-12 -3,-12 -4,-16Z" fill="#fff"/>
        <path d="M-58,-6 Q0,6 58,-6 Q50,34 0,38 Q-50,34 -58,-6Z" fill="url(#g)"/>
        <path d="M-58,-6 Q0,6 58,-6" stroke="#7a3d06" stroke-width="2" fill="none"/>
        <path d="M-40,10 Q0,22 40,10" stroke="#8a4a0a" stroke-width="2" fill="none" stroke-dasharray="4 6"/>
        <circle cx="0" cy="24" r="4" fill="#b8141e"/>
        <path d="M-58,-6 L-74,-12 L-56,2Z" fill="url(#g)"/>
      </g>
      <!-- hanging lantern -->
      <g id="lantern">
        <line x1="0" y1="0" x2="0" y2="1" stroke="url(#g)" stroke-width="2"/>
        <circle cx="0" cy="40" r="55" fill="url(#glow)" opacity=".7"/>
        <path d="M-14,10 L14,10 L18,18 L-18,18Z" fill="url(#g)"/>
        <path d="M-18,18 Q-34,40 -18,62 L18,62 Q34,40 18,18Z" fill="url(#lamp)" stroke="url(#g)" stroke-width="2"/>
        <path d="M0,18 L0,62 M-9,19 Q-16,40 -9,62 M9,19 Q16,40 9,62" stroke="#9a4a0a" stroke-width="1.5" fill="none" opacity=".7"/>
        <path d="M-18,62 L18,62 L12,70 L-12,70Z" fill="url(#g)"/>
        <path d="M-6,70 L-8,92 M0,70 L0,96 M6,70 L8,92" stroke="#e9b44c" stroke-width="2"/>
      </g>
      <g id="spark"><path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2Z" fill="#fff1b8"/></g>
      <g id="burst">
        <g stroke="#e9b44c" stroke-width="2" stroke-linecap="round">
          <line x1="0" y1="-18" x2="0" y2="-60"/><line x1="0" y1="18" x2="0" y2="60"/>
          <line x1="-18" y1="0" x2="-60" y2="0"/><line x1="18" y1="0" x2="60" y2="0"/>
          <line x1="13" y1="13" x2="42" y2="42"/><line x1="-13" y1="-13" x2="-42" y2="-42"/>
          <line x1="13" y1="-13" x2="42" y2="-42"/><line x1="-13" y1="13" x2="-42" y2="42"/>
        </g>
        <g fill="#ffe08a"><circle cy="-68" r="3"/><circle cy="68" r="3"/><circle cx="-68" r="3"/><circle cx="68" r="3"/>
          <circle cx="48" cy="48" r="2.5"/><circle cx="-48" cy="-48" r="2.5"/><circle cx="48" cy="-48" r="2.5"/><circle cx="-48" cy="48" r="2.5"/></g>
      </g>
    </defs>

    <!-- Big mandala behind title -->
    <g transform="translate(540 655)" opacity=".42">
      <circle r="300" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="2 8"/>
      <circle r="225" fill="none" stroke="url(#g)" stroke-width="1"/>
      <circle r="140" fill="none" stroke="url(#g)" stroke-width="1"/>
      <g id="ring2">
        <use href="#petal2"/><use href="#petal2" transform="rotate(22.5)"/><use href="#petal2" transform="rotate(45)"/><use href="#petal2" transform="rotate(67.5)"/>
        <use href="#petal2" transform="rotate(90)"/><use href="#petal2" transform="rotate(112.5)"/><use href="#petal2" transform="rotate(135)"/><use href="#petal2" transform="rotate(157.5)"/>
        <use href="#petal2" transform="rotate(180)"/><use href="#petal2" transform="rotate(202.5)"/><use href="#petal2" transform="rotate(225)"/><use href="#petal2" transform="rotate(247.5)"/>
        <use href="#petal2" transform="rotate(270)"/><use href="#petal2" transform="rotate(292.5)"/><use href="#petal2" transform="rotate(315)"/><use href="#petal2" transform="rotate(337.5)"/>
      </g>
      <g transform="rotate(11.25)">
        <use href="#petal"/><use href="#petal" transform="rotate(22.5)"/><use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(67.5)"/>
        <use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(112.5)"/><use href="#petal" transform="rotate(135)"/><use href="#petal" transform="rotate(157.5)"/>
        <use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(202.5)"/><use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(247.5)"/>
        <use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(292.5)"/><use href="#petal" transform="rotate(315)"/><use href="#petal" transform="rotate(337.5)"/>
      </g>
    </g>

    <!-- Fireworks -->
    <g opacity=".55"><use href="#burst" transform="translate(150 330) scale(1.3)"/><use href="#burst" transform="translate(930 300) scale(1.6)"/>
      <use href="#burst" transform="translate(110 790) scale(.8)"/><use href="#burst" transform="translate(975 760) scale(.9)"/></g>

    <!-- Sparkles -->
    <g opacity=".9">
      <use href="#spark" transform="translate(240 260) scale(.9)"/><use href="#spark" transform="translate(830 410) scale(1.2)"/>
      <use href="#spark" transform="translate(70 560) scale(.7)"/><use href="#spark" transform="translate(1010 560) scale(.8)"/>
      <use href="#spark" transform="translate(300 480) scale(.5)"/><use href="#spark" transform="translate(780 230) scale(.6)"/>
      <use href="#spark" transform="translate(200 960) scale(.6)"/><use href="#spark" transform="translate(880 950) scale(.7)"/>
      <use href="#spark" transform="translate(540 300) scale(.6)"/><use href="#spark" transform="translate(60 1040) scale(.5)"/>
      <use href="#spark" transform="translate(1020 1050) scale(.5)"/>
    </g>
    <g fill="#ffd77a">
      <circle cx="350" cy="220" r="2"/><circle cx="700" cy="330" r="2.5"/><circle cx="160" cy="450" r="2"/><circle cx="960" cy="470" r="2"/>
      <circle cx="250" cy="870" r="2"/><circle cx="840" cy="860" r="2.5"/><circle cx="430" cy="290" r="1.5"/><circle cx="640" cy="250" r="1.5"/>
    </g>

    <!-- Hanging lanterns (strings start at border) -->
    <g>
      <line x1="210" y1="44" x2="210" y2="190" stroke="#e9b44c" stroke-width="2"/><use href="#lantern" transform="translate(210 190)"/>
      <line x1="870" y1="44" x2="870" y2="190" stroke="#e9b44c" stroke-width="2"/><use href="#lantern" transform="translate(870 190)"/>
      <line x1="110" y1="44" x2="110" y2="110" stroke="#e9b44c" stroke-width="2"/><use href="#lantern" transform="translate(110 110) scale(.75)"/>
      <line x1="970" y1="44" x2="970" y2="110" stroke="#e9b44c" stroke-width="2"/><use href="#lantern" transform="translate(970 110) scale(.75)"/>
    </g>

    <!-- Toran (marigold garland) at top -->
    <g>
      <path d="M44,44 Q170,96 297,44 Q423,96 540,44 Q657,96 783,44 Q910,96 1036,44" fill="none" stroke="#2f7d32" stroke-width="3"/>
      <g id="marigolds"></g>
    </g>

    <!-- Ornate double border -->
    <rect x="24" y="24" width="1032" height="1302" fill="none" stroke="url(#g)" stroke-width="4"/>
    <rect x="40" y="40" width="1000" height="1270" fill="none" stroke="url(#g)" stroke-width="1.5"/>
    <g fill="url(#g)">
      <path d="M24,24 l46,0 l-46,46z"/><path d="M1056,24 l-46,0 l46,46z"/>
      <path d="M24,1326 l46,0 l-46,-46z"/><path d="M1056,1326 l-46,0 l46,-46z"/>
    </g>

    <!-- Rangoli-style arc at bottom with diyas -->
    <path d="M40,1310 Q540,1200 1040,1310" fill="rgba(0,0,0,.25)"/>
    <path d="M60,1300 Q540,1230 1020,1300" fill="none" stroke="#e9b44c" stroke-width="1.5" stroke-dasharray="3 7" opacity=".7"/>
    <use href="#diya" transform="translate(130 1250) scale(.95)"/>
    <use href="#diya" transform="translate(950 1250) scale(.95) scale(-1 1)"/>
    <use href="#diya" transform="translate(250 1215) scale(.7)"/>
    <use href="#diya" transform="translate(830 1215) scale(.7) scale(-1 1)"/>

    <!-- Divider used in content -->
  </svg>

  <div class="content">
    <div class="brand-top gold-text">AURA GRAND STAY<small>SERVICE APARTMENTS &nbsp;✦&nbsp; MADURAI</small></div>
    <div class="wish">Wishing you &amp; your family a</div>
    <div class="happy gold-text">Happy</div>
    <div class="diwali gold-text">DIWALI</div>
    <svg class="divider" width="520" height="40" viewBox="0 0 520 40">
      <defs><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#f2bd45" stop-opacity="0"/><stop offset=".5" stop-color="#ffe9a8"/><stop offset="1" stop-color="#f2bd45" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="20" x2="220" y2="20" stroke="url(#g2)" stroke-width="2"/>
      <line x1="300" y1="20" x2="520" y2="20" stroke="url(#g2)" stroke-width="2"/>
      <path d="M260,4 L272,20 L260,36 L248,20Z" fill="#f2bd45"/>
      <circle cx="232" cy="20" r="4" fill="#f2bd45"/><circle cx="288" cy="20" r="4" fill="#f2bd45"/>
    </svg>
    <div class="msg">May the festival of lights fill your home with<br><em>joy, prosperity &amp; happiness.</em><br>Thank you for being part of our family.</div>

    <div class="from">
      <div class="lbl">With warm wishes,</div>
      <div class="name gold-text">Alwarappan</div>
    </div>
  </div>
</div>
<script>
  // marigold garland flowers along the toran curve
  const g=document.getElementById('marigolds'),NS='http://www.w3.org/2000/svg';
  const segs=[[44,297],[297,540],[540,783],[783,1036]];
  segs.forEach(([a,b])=>{for(let i=0;i<=8;i++){const t=i/8,x=a+(b-a)*t; // follows the quadratic toran curve
    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',44+104*t*(1-t));
    c.setAttribute('r',i%2?9:11);c.setAttribute('fill',i%2?'#ffb300':'#ff7b00');c.setAttribute('stroke','#c45200');c.setAttribute('stroke-width','1.5');g.appendChild(c);}
  });
</script>
</body>
</html>
